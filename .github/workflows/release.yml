name: Release
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: npm install --no-audit --no-fund
      - name: Tag matches package.json and jsr.json
        run: |
          v="${GITHUB_REF_NAME#v}"
          test "$(node -p 'require("./package.json").version')" = "$v"
          test "$(node -p 'require("./jsr.json").version')" = "$v"
      - run: npm run typecheck && npm test && npm run build
      # npm trusted publishing (OIDC): no token; provenance is attached automatically.
      - run: npm publish --access public
      - run: deno publish
